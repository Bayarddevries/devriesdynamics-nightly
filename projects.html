<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Bayard deVries</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="design.html">Design</a>
      <a href="resume.html">Resume</a>
    </nav>
  </header>

  <main>
    <section class="hero compact">
      <h1 class="brass-name">Projects</h1>
      <p class="tagline">What I've built</p>
    </section>

    <section class="project-cards" id="projectCards">
      <!-- Cards rendered from JS -->
    </section>
  </main>

  <!-- Project Detail Modal -->
  <div class="project-modal" id="projectModal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-nav modal-prev" id="modalPrev">‹</div>
    <div class="modal-nav modal-next" id="modalNext">›</div>
    <div class="modal-content" id="modalContent">
      <!-- Populated by JS -->
    </div>
    <div class="modal-dots" id="modalDots">
      <!-- Populated by JS -->
    </div>
  </div>

  <footer>
    <p class="site-by">Bayard deVries · <a href="index.html" style="color: var(--color-brass);">Home</a></p>
  </footer>

  <script>
    // ============================================
    // PROJECT DATA — Add new projects here
    // ============================================
    var projects = [
      {
        id: 'shoebox',
        title: 'Shoebox V2',
        shortDesc: 'Interactive Métis photo archive',
        description: 'A full-stack digital archival ecosystem designed for community preservation. Engineered the metadata architecture and hardware integration to transform a 300+ photo collection into a searchable, geolocated narrative experience.',
        tech: ['React', 'Leaflet', 'IndexedDB', 'PWA'],
        year: '2024',
        link: 'https://bayarddevries.github.io/shoebox-v2/',
        color: '#6B8F52'
      },
      {
        id: 'homeland-map',
        title: 'Homeland Map',
        shortDesc: 'Interactive Métis territory visualization',
        description: 'A high-fidelity spatial data project visualizing Métis territory. Features complex D3.js animations of migration patterns and historical resource overlays, translating archival records into an interactive cartographic interface.',
        tech: ['D3.js', 'GeoJSON', 'Leaflet', 'TopoJSON'],
        year: '2024',
        link: 'https://bayarddevries.github.io/metis-homeland-map/',
        color: '#C49A3A'
      },
      {
        id: 'metis-trail',
        title: 'Métis Trail RPG',
        shortDesc: 'Narrative-driven historical game',
        description: 'A narrative-driven historical simulation built on a custom TypeScript engine. Blends authentic 19th-century economic mechanics (Made Beaver) with branching storylines and handcrafted 32-color pixel art.',
        tech: ['TypeScript', 'Canvas', 'Pixel Art', 'd20 System'],
        year: '2024',
        link: null,
        color: '#6B1C23'
      },
      {
        id: 'rrmnhc',
        title: 'RRMNHC Site',
        shortDesc: 'Red River Métis Nation Heritage Centre',
        description: 'Website for the Red River Métis Nation Heritage Centre. Information about exhibitions, events, and Métis history. Content managed via Contentful CMS, with interactive elements powered by Three.js.',
        tech: ['Next.js', 'Contentful', 'Three.js', 'Vercel'],
        year: '2023',
        link: 'https://rrmnhc.ca/',
        color: '#8FAE7C'
      }
    ];

    // ============================================
    // DOM ELEMENTS
    // ============================================
    var cardsContainer = document.getElementById('projectCards');
    var modal = document.getElementById('projectModal');
    var modalContent = document.getElementById('modalContent');
    var modalClose = document.getElementById('modalClose');
    var modalPrev = document.getElementById('modalPrev');
    var modalNext = document.getElementById('modalNext');
    var modalDots = document.getElementById('modalDots');
    var currentProjectIndex = 0;

    // ============================================
    // FUNCTIONS
    // ============================================
    function renderCards() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        html += '<article class="project-card-interactive" data-index="' + i + '" style="--accent: ' + p.color + '" onclick="openModal(' + i + ')">';
        html += '<h3>' + p.title + '</h3>';
        html += '<p>' + p.shortDesc + '</p>';
        html += '<span class="card-year">' + p.year + '</span>';
        html += '</article>';
      }
      cardsContainer.innerHTML = html;
    }

    function renderDots() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        html += '<span class="dot ' + (i === currentProjectIndex ? 'active' : '') + '" data-index="' + i + '"></span>';
      }
      modalDots.innerHTML = html;
      
      var dots = modalDots.querySelectorAll('.dot');
      for (var j = 0; j < dots.length; j++) {
        dots[j].addEventListener('click', (function(idx) {
          return function() {
            currentProjectIndex = idx;
            openModal(idx);
          };
        })(j));
      }
    }

    function openModal(index) {
      var p = projects[index];
      currentProjectIndex = index;
      
      var techHtml = '';
      for (var i = 0; i < p.tech.length; i++) {
        techHtml += '<span class="tag">' + p.tech[i] + '</span>';
      }
      
      modalContent.innerHTML = '<h2 style="color: ' + p.color + '; margin-bottom: 0.5rem;">' + p.title + '</h2>' +
        '<p class="modal-year" style="color: var(--color-text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">' + p.year + '</p>' +
        '<p class="modal-desc" style="font-size: 1.1rem; line-height: 1.7; margin-bottom: 1.5rem;">' + p.description + '</p>' +
        '<div class="modal-tech">' + techHtml + '</div>' +
        (p.link ? '<a href="' + p.link + '" target="_blank" rel="noopener" class="btn btn-primary" style="margin-top: 1.5rem; display: inline-block;">View Project ↗</a>' : '');
      
      renderDots();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    modalPrev.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length;
      openModal(currentProjectIndex);
    });

    modalNext.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex + 1) % projects.length;
      openModal(currentProjectIndex);
    });

    document.addEventListener('keydown', function(e) {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length;
      if (e.key === 'ArrowRight') currentProjectIndex = (currentProjectIndex + 1) % projects.length;
      openModal(currentProjectIndex);
    });

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      renderCards();
    });
  </script>
</body>
</html>
