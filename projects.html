<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Bayard deVries</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Personal project badge */
    .project-badge-personal {
      display: inline-block;
      font-size: 0.6rem;
      font-family: var(--font-heading);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-brass);
      background: var(--color-brass-glow);
      border: 1px solid var(--color-brass-dim);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      vertical-align: middle;
      margin-left: 0.4rem;
    }
    .project-card-interactive .project-badge-personal {
      font-size: 0.55rem;
    }

    /* Gallery thumbnails inside modal */
    .modal-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .modal-gallery img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      object-position: top left;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      transition: transform 0.2s ease, border-color 0.2s ease;
      cursor: pointer;
    }
    .modal-gallery img:hover {
      transform: scale(1.02);
      border-color: var(--color-brass);
    }
    /* Card thumbnail */
    .card-thumb {
      margin: -1.5rem -1.5rem 1rem -1.5rem;
      overflow: hidden;
      border-radius: 12px 12px 0 0;
      height: 160px;
      background: var(--color-bg);
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      transition: transform 0.3s ease;
    }
    .project-card-interactive:hover .card-thumb img {
      transform: scale(1.04);
    }
    /* Lightbox overlay */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
    }
    /* Gallery section label */
    .gallery-label {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html" class="active">Projects</a>
      <a href="resume.html">Resume</a>
    </nav>
  </header>

  <main>
    <section class="hero compact">
      <h1 class="brass-name">Projects</h1>
      <p class="tagline">What I've built</p>
    </section>

    <section class="project-cards" id="projectCards">
      <!-- Cards rendered from JS -->
    </section>
  </main>

  <div class="project-modal" id="projectModal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-nav modal-prev" id="modalPrev">‹</div>
    <div class="modal-nav modal-next" id="modalNext">›</div>
    <div class="modal-content" id="modalContent">
      <!-- Populated by JS -->
    </div>
    <div class="modal-dots" id="modalDots">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

  <footer>
    <p class="site-by">Bayard deVries · <a href="index.html" style="color: var(--color-brass);">Home</a></p>
  </footer>

  <script>
    // ============================================
    // PROJECT DATA — Add new projects here
    // ============================================
    var projects = [
      {
        id: 'shoebox',
        title: 'Shoebox V2',
        shortDesc: 'A heritage preservation system built from nothing',
        tagline: 'Turning fading memories into a searchable archive',
        description: 'Métis history was literally fading — photos in shoeboxes, stories lost as generations passed. I was asked to capture these before they disappeared. Given only a budget for an Epson scanner, I built the entire archival ecosystem from scratch: grassroots community organizing to collect photos, legal frameworks for image rights, open-source infrastructure, and a searchable interface. Collecting 300+ photos at scale proved harder than the software.',
        role: 'Solo build — grassroots organizing, scanning, metadata architecture, database design, frontend development, stakeholder training',
        challenge: 'No budget, no team, no existing process. Every photo needed to be matched to a family, a story, and a place — then made searchable without losing context.',
        outcome: 'Community members now find relatives in the archive and reconnect with family history they thought was lost. That excitement from our people is the only metric that matters.',
        tech: ['React', 'Leaflet', 'IndexedDB', 'PWA'],
        year: '2024',
        link: 'https://bayarddevries.github.io/shoebox-v2/',
        repo: 'https://github.com/Bayarddevries/shoebox-v2',
        color: '#6B8F52',
        screenshots: [
          { src: 'assets/shoebox-v2-splash.png', alt: 'Shoebox V2 splash/interface screen' },
          { src: 'assets/shoebox-grid.png', alt: 'Shoebox V2 photo grid view' }
        ]
      },
      {
        id: 'homeland-map',
        title: 'Homeland Map',
        shortDesc: 'Interactive Métis territory visualization',
        tagline: 'Mapping a homeland that history tried to erase',
        description: 'Part of my role at the Heritage Centre is developing data for exhibits. When tasked with building an interactive Homeland map, I had no research team and no historical cartography experience. I learned Google Earth Pro to warp and retrace historical trail maps, waterway routes, and settlement data — then built the interactive layers myself. The challenge was that multiple historical maps needed to be considered as a whole, and achieving consensus on accuracy was ongoing.',
        role: 'Solo research and build — historical map digitization, GeoJSON data compilation, D3.js visualization, cartographic layer design',
        challenge: 'No precedent data, no specialist support. Had to learn spatial research tools independently and develop a methodology for reconciling conflicting historical sources.',
        outcome: 'Researchers who reviewed the project validated the approach. Users now explore just how far-reaching Métis influence was — and remains.',
        tech: ['D3.js', 'GeoJSON', 'Leaflet', 'TopoJSON'],
        year: '2024',
        link: 'https://bayarddevries.github.io/metis-homeland-map/',
        repo: 'https://github.com/Bayarddevries/metis-homeland-map',
        color: '#C49A3A',
        screenshots: [
          { src: 'assets/homeland-map-main.png', alt: 'Homeland Map main interactive view' },
          { src: 'assets/homeland-map-polygon.png', alt: 'Homeland Map territory polygon overlay' },
          { src: 'assets/homeland-map-splash.png', alt: 'Homeland Map splash/loading screen' }
        ]
      },
      {
        id: 'rrmnhc',
        title: 'RRMNHC Site',
        shortDesc: 'AI-augmented rapid prototyping → production heritage site',
        tagline: 'A testbed that became the product',
        description: 'Heritage Centre leadership needed a way to visualize concepts — colors, fonts, layouts, interactive elements — before committing to expensive third-party development. I built a working prototype using AI agents as a test of orchestrated agentic web development. The goal was rapid iteration: show leaders something clickable in days, not months. It worked so well that the prototype became the production site — a decision-making tool that\'s now scalable across multiple projects.',
        role: 'Designer and orchestrator — AI agent workflow design, rapid prototyping, interface design, production deployment',
        challenge: 'Making something look world-class without a design team or large budget. The rapid feedback loop with leadership meant every iteration had to be polished, not just functional.',
        outcome: 'The site is now used as a living decision-making tool by Heritage Centre leadership. The AI-augmented prototyping process developed has become a repeatable method applicable across future projects.',
        tech: ['Next.js', 'Contentful', 'Three.js', 'Vercel'],
        year: '2023',
        link: 'https://rrmnhc.ca/',
        repo: null,
        color: '#8FAE7C',
        screenshots: [
          { src: 'assets/rrmnhc-splash.png', alt: 'RRMNHC website splash page' },
          { src: 'assets/rrmnhc-menu.png', alt: 'RRMNHC website menu/navigation' },
          { src: 'assets/rrmnhc-news.png', alt: 'RRMNHC website news section' }
        ]
      },
      {
        id: 'west-and-back',
        title: 'West and Back',
        shortDesc: 'A narrative-driven historical RPG',
        tagline: 'A Métis survival journey across the prairies',
        description: 'A narrative-driven historical simulation built on a custom TypeScript engine. Blends authentic 19th-century economic mechanics (Made Beaver currency) with branching storylines and handcrafted 32-color pixel art. Inspired by the Oregon Trail but rooted in real Métis history — the fur trade, the Red River Settlement, and the push west. Currently in active development with four playable scenarios.',
        role: 'Solo project — game design, pixel art, TypeScript engine development, historical research',
        challenge: 'Balancing historical accuracy with engaging gameplay. Every scenario needs to teach something real about Métis experience while remaining fun and replayable.',
        outcome: 'Four scenarios in development: Failed Hunt, Trading Run, Letter Run, and Pilgrimage. The custom d20 + push-your-luck system creates tense, meaningful decisions.',
        tech: ['TypeScript', 'Canvas', 'Pixel Art', 'Aseprite'],
        year: '2025',
        link: null,
        repo: null,
        color: '#C49A3A',
        screenshots: [],
        personal: true
      },
      {
        id: 'wilting-flower',
        title: 'Wilting Flower',
        shortDesc: 'Interactive kinetic sculpture',
        tagline: 'A flower that blooms when you approach',
        description: 'An interactive kinetic sculpture that responds to human presence. A Laser ToF (Time of Flight) sensor detects when someone approaches, triggering an Arduino Nano to actuate an MG996R servo that makes a flower "bloom" and "breathe" — petals opening and closing with an LED glow. The piece explores the relationship between technology and organic form: cold electronics creating something that feels alive.',
        role: 'Solo build — circuit design, Arduino programming, servo control, sensor integration, physical fabrication',
        challenge: 'Making mechanical movement feel organic rather than robotic. The servo control needed careful easing curves to mimic natural motion rather than mechanical snapping.',
        outcome: 'A working prototype that reliably detects approach, blooms the flower, holds while the viewer is present, and slowly closes when they leave. The effect is surprisingly emotional.',
        tech: ['Arduino Nano', 'Laser ToF Sensor', 'MG996R Servo', 'LED', 'C++'],
        year: '2025',
        link: null,
        repo: null,
        color: '#8FAE7C',
        screenshots: [
          { src: 'assets/wilting-flower-design.png', alt: 'Wilting Flower design diagram' }
        ],
        personal: true
      }
    ];

    // ============================================
    // DOM ELEMENTS
    // ============================================
    var cardsContainer = document.getElementById('projectCards');
    var modal = document.getElementById('projectModal');
    var modalContent = document.getElementById('modalContent');
    var modalClose = document.getElementById('modalClose');
    var modalPrev = document.getElementById('modalPrev');
    var modalNext = document.getElementById('modalNext');
    var modalDots = document.getElementById('modalDots');
    var currentProjectIndex = 0;
    var lightbox = document.getElementById('lightbox');
    var lightboxImg = document.getElementById('lightboxImg');

    // ============================================
    // FUNCTIONS
    // ============================================
    function renderCards() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        var badge = p.personal ? ' <span class="project-badge-personal">Personal</span>' : '';
        html += '<article class="project-card-interactive" data-index="' + i + '" style="--accent: ' + p.color + '" onclick="openModal(' + i + ')">';
        if (p.screenshots && p.screenshots.length > 0) {
          html += '<div class="card-thumb"><img src="' + p.screenshots[0].src + '" alt="' + p.screenshots[0].alt + '" loading="lazy"></div>';
        }
        html += '<h3>' + p.title + badge + '</h3>';
        html += '<p>' + p.shortDesc + '</p>';
        html += '<span class="card-year">' + p.year + '</span>';
        html += '</article>';
      }
      cardsContainer.innerHTML = html;
    }

    function renderDots() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        html += '<span class="dot ' + (i === currentProjectIndex ? 'active' : '') + '" data-index="' + i + '"></span>';
      }
      modalDots.innerHTML = html;
      
      var dots = modalDots.querySelectorAll('.dot');
      for (var j = 0; j < dots.length; j++) {
        dots[j].addEventListener('click', (function(idx) {
          return function() {
            currentProjectIndex = idx;
            openModal(idx);
          };
        })(j));
      }
    }

    function renderGallery(screenshots) {
      if (!screenshots || screenshots.length === 0) return '';
      var html = '<div class="gallery-label">Screenshots</div>';
      html += '<div class="modal-gallery">';
      for (var i = 0; i < screenshots.length; i++) {
        html += '<img src="' + screenshots[i].src + '" alt="' + screenshots[i].alt + '" onclick="event.stopPropagation(); showLightbox(\'' + screenshots[i].src + '\')">';
      }
      html += '</div>';
      return html;
    }

    function openModal(index) {
      var p = projects[index];
      currentProjectIndex = index;

      var techHtml = '';
      for (var i = 0; i < p.tech.length; i++) {
        techHtml += '<span class="tag">' + p.tech[i] + '</span>';
      }

      var tagLineHtml = p.tagline ? '<p class="modal-tagline" style="color: var(--color-text-muted); font-size: 0.95rem; font-style: italic; margin-bottom: 1.5rem; border-left: 3px solid ' + p.color + '; padding-left: 1rem;">' + p.tagline + '</p>' : '';
      var roleHtml = p.role ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Role</h4><p style="color: var(--color-text); font-size: 0.95rem;">' + p.role + '</p></div>' : '';
      var challengeHtml = p.challenge ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Challenge</h4><p style="color: var(--color-text); font-size: 0.95rem;">' + p.challenge + '</p></div>' : '';
      var outcomeHtml = p.outcome ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Outcome</h4><p style="color: var(--color-green-bright); font-size: 0.95rem;">' + p.outcome + '</p></div>' : '';
      var repoHtml = p.repo ? '<a href="' + p.repo + '" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-top: 0.5rem; margin-right: 0.5rem;">View Source ↗</a>' : '';
      var galleryHtml = renderGallery(p.screenshots);

      modalContent.innerHTML = '<h2 style="color: ' + p.color + '; margin-bottom: 0.5rem;">' + p.title + '</h2>' +
        '<p class="modal-year" style="color: var(--color-text-muted); font-size: 0.85rem; margin-bottom: 0;">' + p.year + '</p>' +
        tagLineHtml +
        galleryHtml +
        '<p class="modal-desc" style="font-size: 1rem; line-height: 1.75; margin-bottom: 1.5rem; color: var(--color-text-muted);">' + p.description + '</p>' +
        '<div style="display: grid; gap: 1.25rem; margin-bottom: 1.5rem;">' + roleHtml + challengeHtml + outcomeHtml + '</div>' +
        '<div class="modal-tech" style="margin-bottom: 1rem;">' + techHtml + '</div>' +
        (p.link ? '<a href="' + p.link + '" target="_blank" rel="noopener" class="btn btn-primary">View Project ↗</a>' : '') +
        repoHtml;

      renderDots();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    function showLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    lightbox.addEventListener('click', closeLightbox);

    modalPrev.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length;
      openModal(currentProjectIndex);
    });

    modalNext.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex + 1) % projects.length;
      openModal(currentProjectIndex);
    });

    document.addEventListener('keydown', function(e) {
      if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        return;
      }
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') { currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length; openModal(currentProjectIndex); }
      if (e.key === 'ArrowRight') { currentProjectIndex = (currentProjectIndex + 1) % projects.length; openModal(currentProjectIndex); }
    });

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      renderCards();
    });
  </script>
</body>
</html>
