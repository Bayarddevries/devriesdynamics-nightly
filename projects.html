    <section class="three-demo" style="padding: 2rem 0; background: var(--color-bg);">
      <h2 style="text-align:center; margin-bottom:1rem; color:var(--color-brass);">Three.js Demo</h2>
      <div class="demo-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2rem;justify-items:center;">
        <canvas class="three-canvas" id="demoCube" width="300" height="200"></canvas>
        <canvas class="three-canvas" id="demoModel" width="300" height="200"></canvas>
        <canvas class="three-canvas" id="demoParticles" width="300" height="200"></canvas>
      </div>
      <p style="text-align:center;margin-top:1rem;font-size:0.9rem;color:var(--color-text-muted);">(Hover / drag to orbit each scene)</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js"></script>
    <script>
    // ------------------- Helper to init a scene -------------------
    function initScene(canvas, setupFn) {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
      const width = canvas.clientWidth; const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 100);
      camera.position.set(2,2,3);
      const controls = new THREE.OrbitControls(camera, canvas);
      controls.enableDamping = true;
      const ambient = new THREE.AmbientLight(0xffffff,0.8);
      scene.add(ambient);
      const dir = new THREE.DirectionalLight(0xffffff,0.5);
      dir.position.set(5,5,5);
      scene.add(dir);
      // custom objects from user‑provided callback
      const obj = setupFn(scene, camera);
      // animation loop
      function animate(){
        requestAnimationFrame(animate);
        if(obj && obj.tick) obj.tick();
        controls.update();
        renderer.render(scene,camera);
      }
      animate();
      // handle resize
      window.addEventListener('resize',()=>{
        const w = canvas.clientWidth, h = canvas.clientHeight;
        renderer.setSize(w,h,false);
        camera.aspect = w/h; camera.updateProjectionMatrix();
      });
    }
    // ------------------- Demo 1: Rotating Cube -------------------
    initScene(document.getElementById('demoCube'), (scene)=>{
      const geom = new THREE.BoxGeometry(1,1,1);
      const mat = new THREE.MeshStandardMaterial({color:'#C49A3A', roughness:0.4, metalness:0.2});
      const cube = new THREE.Mesh(geom, mat);
      scene.add(cube);
      return { tick:()=>{cube.rotation.x+=0.005; cube.rotation.y+=0.003;}};
    });
    // ------------------- Demo 2: GLTF Model (placeholder) ---------
    initScene(document.getElementById('demoModel'), (scene)=>{
      const loader = new THREE.GLTFLoader();
      // placeholder cheap geometry if model fails to load
      const fallback = new THREE.Mesh(
        new THREE.SphereGeometry(0.8,32,32),
        new THREE.MeshStandardMaterial({color:'#6B8F52'})
      );
      scene.add(fallback);
      loader.load('assets/models/placeholder.glb', (gltf)=>{
        scene.remove(fallback);
        const model = gltf.scene;
        model.scale.set(0.6,0.6,0.6);
        scene.add(model);
      }, undefined, (err)=>{ console.warn('GLTF load error – using fallback',err); });
      return {};
    });
    // ------------------- Demo 3: Simple Particle Field -------------
    initScene(document.getElementById('demoParticles'), (scene)=>{
      const particles = new THREE.BufferGeometry();
      const count = 5000;
      const positions = new Float32Array(count*3);
      for(let i=0;i<count;i++){
        positions[i*3] = (Math.random()-0.5)*6;
        positions[i*3+1] = (Math.random()-0.5)*6;
        positions[i*3+2] = (Math.random()-0.5)*6;
      }
      particles.setAttribute('position', new THREE.BufferAttribute(positions,3));
      const material = new THREE.PointsMaterial({size:0.04, color:'#A67C29'});
      const pts = new THREE.Points(particles, material);
      scene.add(pts);
      return { tick:()=>{pts.rotation.y+=0.001;}};
    });
    </script>
  <div class="project-modal" id="projectModal">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-nav modal-prev" id="modalPrev">‹</div>
    <div class="modal-nav modal-next" id="modalNext">›</div>
    <div class="modal-content" id="modalContent">
      <!-- Populated by JS -->
    </div>
    <div class="modal-dots" id="modalDots">
      <!-- Populated by JS -->
    </div>

  <footer>

  <script>
    // ============================================
    // PROJECT DATA — Add new projects here
    // ============================================
    var projects = [
      {
        id: 'shoebox',
        title: 'Shoebox V2',
        shortDesc: 'A heritage preservation system built from nothing',
        tagline: 'Turning fading memories into a searchable archive',
        description: 'Métis history was literally fading — photos in shoeboxes, stories lost as generations passed. I was asked to capture these before they disappeared. Given only a budget for an Epson scanner, I built the entire archival ecosystem from scratch: grassroots community organizing to collect photos, legal frameworks for image rights, open-source infrastructure, and a searchable interface. Collecting 300+ photos at scale proved harder than the software.',
        role: 'Solo build — grassroots organizing, scanning, metadata architecture, database design, frontend development, stakeholder training',
        challenge: 'No budget, no team, no existing process. Every photo needed to be matched to a family, a story, and a place — then made searchable without losing context.',
        outcome: 'Community members now find relatives in the archive and reconnect with family history they thought was lost. That excitement from our people is the only metric that matters.',
        tech: ['React', 'Leaflet', 'IndexedDB', 'PWA'],
        year: '2024',
        link: 'https://bayarddevries.github.io/shoebox-v2/',
        repo: 'https://github.com/Bayarddevries/shoebox-v2',
        color: '#6B8F52'
      },
      {
        id: 'homeland-map',
        title: 'Homeland Map',
        shortDesc: 'Interactive Métis territory visualization',
        tagline: 'Mapping a homeland that history tried to erase',
        description: 'Part of my role at the Heritage Centre is developing data for exhibits. When tasked with building an interactive Homeland map, I had no research team and no historical cartography experience. I learned Google Earth Pro to warp and retrace historical trail maps, waterway routes, and settlement data — then built the interactive layers myself. The challenge was that multiple historical maps needed to be considered as a whole, and achieving consensus on accuracy was ongoing.',
        role: 'Solo research and build — historical map digitization, GeoJSON data compilation, D3.js visualization, cartographic layer design',
        challenge: 'No precedent data, no specialist support. Had to learn spatial research tools independently and develop a methodology for reconciling conflicting historical sources.',
        outcome: 'Researchers who reviewed the project validated the approach. Users now explore just how far-reaching Métis influence was — and remains.',
        tech: ['D3.js', 'GeoJSON', 'Leaflet', 'TopoJSON'],
        year: '2024',
        link: 'https://bayarddevries.github.io/metis-homeland-map/',
        repo: 'https://github.com/Bayarddevries/metis-homeland-map',
        color: '#C49A3A'
      },
      {
        id: 'rrmnhc',
        title: 'RRMNHC Site',
        shortDesc: 'AI-augmented rapid prototyping → production heritage site',
        tagline: 'A testbed that became the product',
        description: 'Heritage Centre leadership needed a way to visualize concepts — colors, fonts, layouts, interactive elements — before committing to expensive third-party development. I built a working prototype using AI agents as a test of orchestrated agentic web development. The goal was rapid iteration: show leaders something clickable in days, not months. It worked so well that the prototype became the production site — a decision-making tool that\'s now scalable across multiple projects.',
        role: 'Designer and orchestrator — AI agent workflow design, rapid prototyping, interface design, production deployment',
        challenge: 'Making something look world-class without a design team or large budget. The rapid feedback loop with leadership meant every iteration had to be polished, not just functional.',
        outcome: 'The site is now used as a living decision-making tool by Heritage Centre leadership. The AI-augmented prototyping process developed has become a repeatable method applicable across future projects.',
        tech: ['Next.js', 'Contentful', 'Three.js', 'Vercel'],
        year: '2023',
        link: 'https://rrmnhc.ca/',
        repo: null,
        color: '#8FAE7C'
      }
    ];

    // ============================================
    // DOM ELEMENTS
    // ============================================
    var cardsContainer = document.getElementById('projectCards');
    var modal = document.getElementById('projectModal');
    var modalContent = document.getElementById('modalContent');
    var modalClose = document.getElementById('modalClose');
    var modalPrev = document.getElementById('modalPrev');
    var modalNext = document.getElementById('modalNext');
    var modalDots = document.getElementById('modalDots');
    var currentProjectIndex = 0;

    // ============================================
    // FUNCTIONS
    // ============================================
    function renderCards() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        var p = projects[i];
        html += '<article class="project-card-interactive" data-index="' + i + '" style="--accent: ' + p.color + '" onclick="openModal(' + i + ')">';
        html += '<h3>' + p.title + '</h3>';
        html += '<p>' + p.shortDesc + '</p>';
        html += '<span class="card-year">' + p.year + '</span>';
        html += '</article>';
      }
      cardsContainer.innerHTML = html;
    }

    function renderDots() {
      var html = '';
      for (var i = 0; i < projects.length; i++) {
        html += '<span class="dot ' + (i === currentProjectIndex ? 'active' : '') + '" data-index="' + i + '"></span>';
      }
      modalDots.innerHTML = html;
      
      var dots = modalDots.querySelectorAll('.dot');
      for (var j = 0; j < dots.length; j++) {
        dots[j].addEventListener('click', (function(idx) {
          return function() {
            currentProjectIndex = idx;
            openModal(idx);
          };
        })(j));
      }
    }

    function openModal(index) {
      var p = projects[index];
      currentProjectIndex = index;

      var techHtml = '';
      for (var i = 0; i < p.tech.length; i++) {
        techHtml += '<span class="tag">' + p.tech[i] + '</span>';
      }

      var tagLineHtml = p.tagline ? '<p class="modal-tagline" style="color: var(--color-text-muted); font-size: 0.95rem; font-style: italic; margin-bottom: 1.5rem; border-left: 3px solid ' + p.color + '; padding-left: 1rem;">' + p.tagline + '</p>' : '';

      var roleHtml = p.role ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Role</h4><p style="color: var(--color-text); font-size: 0.95rem;">' + p.role + '</p></div>' : '';

      var challengeHtml = p.challenge ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Challenge</h4><p style="color: var(--color-text); font-size: 0.95rem;">' + p.challenge + '</p></div>' : '';

      var outcomeHtml = p.outcome ? '<div class="modal-section"><h4 style="color: var(--color-brass); font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem;">Outcome</h4><p style="color: var(--color-green-bright); font-size: 0.95rem;">' + p.outcome + '</p></div>' : '';

      var repoHtml = p.repo ? '<a href="' + p.repo + '" target="_blank" rel="noopener" class="btn btn-secondary" style="margin-top: 0.5rem; margin-right: 0.5rem;">View Source ↗</a>' : '';

      modalContent.innerHTML = '<h2 style="color: ' + p.color + '; margin-bottom: 0.5rem;">' + p.title + '</h2>' +
        '<p class="modal-year" style="color: var(--color-text-muted); font-size: 0.85rem; margin-bottom: 0;">' + p.year + '</p>' +
        tagLineHtml +
        '<p class="modal-desc" style="font-size: 1rem; line-height: 1.75; margin-bottom: 1.5rem; color: var(--color-text-muted);">' + p.description + '</p>' +
        '<div style="display: grid; gap: 1.25rem; margin-bottom: 1.5rem;">' + roleHtml + challengeHtml + outcomeHtml + '</div>' +
        '<div class="modal-tech" style="margin-bottom: 1rem;">' + techHtml + '</div>' +
        (p.link ? '<a href="' + p.link + '" target="_blank" rel="noopener" class="btn btn-primary">View Project ↗</a>' : '') +
        repoHtml;

      renderDots();
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // ============================================
    // EVENT LISTENERS
    // ============================================
    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });

    modalPrev.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length;
      openModal(currentProjectIndex);
    });

    modalNext.addEventListener('click', function() {
      currentProjectIndex = (currentProjectIndex + 1) % projects.length;
      openModal(currentProjectIndex);
    });

    document.addEventListener('keydown', function(e) {
      if (!modal.classList.contains('open')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowLeft') currentProjectIndex = (currentProjectIndex - 1 + projects.length) % projects.length;
      if (e.key === 'ArrowRight') currentProjectIndex = (currentProjectIndex + 1) % projects.length;
      openModal(currentProjectIndex);
    });

    // ============================================
    // INIT
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
      renderCards();
    });
  </script>
